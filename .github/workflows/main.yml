name: Build and Test

on:
  push:
    branches:
      - review

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Docker Compose
        run: |
          sudo apt-get update
          sudo apt-get install -y docker-compose

      - name: Build the stack
        run: docker-compose build

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: "3.x"

      - name: Lint Python
        run: |
          pip install flake8
          flake8 backend/ --ignore=E501,F401,E402

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: "14"

      - name: Lint JavaScript
        run: |
          npm install eslint
          ./node_modules/.bin/eslint frontend/ backend/ --ext .js
